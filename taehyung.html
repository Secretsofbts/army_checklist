  <script>
      function renderBadge(elId, key) {
      var el = document.getElementById(elId);
      var known = getStatTotal(key);
      var raw = localStorage.getItem('progress:' + key);
      var rawData = raw ? JSON.parse(raw) : null;
      var checked = rawData ? rawData.checked : 0;
      var total = known !== null ? known : (rawData ? rawData.total : 0);
      if (total === 0) { el.textContent = ''; return; }
      if (checked === total) {
        el.textContent = 'вњ…';
        el.classList.add('done');
        el.closest('.card').classList.add('row-done');
      } else {
        el.textContent = checked + '/' + total;
      }
    }
function renderAllBadges() {
    renderBadge('badge-2015-2022', 'taehyung-2015-2022');
    renderBadge('badge-2023-2024', 'taehyung-2023-2024');
    renderBadge('badge-2025', 'taehyung-2025');

    }
