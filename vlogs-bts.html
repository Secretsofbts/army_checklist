    <script>
      function renderBadgeTotal(elId, keys) {
      var el = document.getElementById(elId);
      var checked = 0, total = 0;
      var allKnown = true;
      keys.forEach(function(key) {
        var known = getStatTotal(key);
        var raw = localStorage.getItem('progress:' + key);
        var data = raw ? JSON.parse(raw) : null;
        if (known !== null) {
          total += known;
          checked += data ? data.checked : 0;
        } else if (data) {
          total += data.total;
          checked += data.checked;
        } else {
          allKnown = false;
        }
      });
      if (total === 0) { el.textContent = ''; return; }
      if (allKnown && checked === total) {
        el.textContent = 'вњ…';
        el.style.color = '#2e9e5b';
        el.closest('.card').classList.add('row-done');
      } else {
        el.textContent = checked + '/' + total;
      }
    }
        function renderBadgeJungkook() {
  var el = document.getElementById('badge-vb-jungkook');

    var raw = localStorage.getItem('progress:' + key);
    var data = raw ? JSON.parse(raw) : null;
    if (known !== null) {
      total += known;
      checked += data ? data.checked : 0;
    } else if (data) {

      checked += data.checked;

  });
  // "РўСЂРµРЅРёСЂРѕРІРєР° Р§РѕРЅРўСЌРҐРѕ" (video-5570) СѓС‡С‚РµРЅР° РІ РѕР±РѕРёС… СЃРїРёСЃРєР°С… вЂ” РІС‹С‡РёС‚Р°РµРј РїРѕРІС‚РѕСЂ
  total -= 1;
  if (localStorage.getItem('video-5570') === 'true') {

  if (total === 0) { el.textContent = ''; return; }
  if (checked === total) {

    el.style.color = '#2e9e5b';
    el.closest('.card').classList.add('row-done');

    el.textContent = checked + '/' + total;

}
