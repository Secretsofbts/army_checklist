    .intro { font-size: 13px; color: #555; margin: 0 0 10px; }
    .disc-title { font-size: 13px; font-weight: 600; color: #888; margin: 16px 0 4px; }
    .month-title { font-size: 12px; font-weight: 600; color: #aaa; margin: 8px 0 2px; }
    .row { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
    input[type="checkbox"] { width: 18px; height: 18px; flex-shrink: 0; }
    .text { flex: 1; cursor: pointer; color: #333; }
    .text.done { color: #bbb; text-decoration: line-through; }
    .link { color: #999; text-decoration: none; font-size: 13px; flex-shrink: 0; }
    .eng-badge { font-size: 9px; color: #9b7fd4; border: 1px solid #d9cdf0; border-radius: 5px; padding: 1px 4px; flex-shrink: 0; }
    .footer-link { display: block; text-align: center; font-size: 13px; color: #000; text-decoration: none; margin-top: 16px; padding-top: 12px; border-top: 1px solid #eee; }
  </style>
</head>

          { text: "Saturday Night Live", sub: "За кадром", link: "https://t.me/violent_arhive/1651" },

        ]},

        ]}

        ]},

      { disc: "Диск 6", groups: [
        { month: "Октябрь", items: [
          { text: "'LY: Speak Yourself' Финал в Сеуле VCR #2", sub: "За кадром", eng: true, link: "https://t.me/violent_arhive/1666" },
          { text: "'LY: Speak Yourself' Саудовская Аравия", sub: "За кадром", link: "https://t.me/violent_arhive/1663" }
        ]},
        { month: "Ноябрь", items: [
          { text: "2020 Winter Package", sub: "За кадром", link: "https://t.me/violent_arhive/1673" },
          { text: "2019 MMA / MAMA VCR и практика", sub: "За кадром", link: "https://t.me/violent_arhive/1664" },
          { text: "2019 MMA", sub: "За кадром", link: "https://t.me/violent_arhive/1667" }
        ]},
        { month: "Декабрь", items: [
          { text: "2019 MAMA", sub: "За кадром", link: "https://t.me/violent_arhive/1665" },
          { text: "2019 iHeartRadio Jingle Ball и Variety Hitmaker Awards", sub: "За кадром", link: "https://t.me/violent_arhive/1669" },
          { text: "Dick Clark's New Year's Rockin' Eve", sub: "За кадром", link: "https://t.me/violent_arhive/1668" }
        ]}
      ]}
    ];

    const listEl = document.getElementById('list');
    data.forEach((disc) => {
      const discTitle = document.createElement('div');
      discTitle.className = 'disc-title';
      discTitle.textContent = disc.disc + ':';
      listEl.appendChild(discTitle);

      disc.groups.forEach((group) => {
        if (group.month) {
          const monthTitle = document.createElement('div');
          monthTitle.className = 'month-title';
          monthTitle.textContent = group.month + ':';
          listEl.appendChild(monthTitle);
        }

        group.items.forEach((item) => {
          const id = 'video-' + item.link.split('/').pop();
          const row = document.createElement('div');
          row.className = 'row';
          row.dataset.id = id;

          const box = document.createElement('input');
          box.type = 'checkbox';

          const span = document.createElement('span');
          span.className = 'text';
          span.textContent = item.text;
          if (item.sub) {
            const sub = document.createElement('span');
            sub.style.cssText = 'display:block; font-size:11px; color:#999; margin-top:2px; font-weight:400;';
            sub.textContent = item.sub;
            span.appendChild(sub);
          }

          if (localStorage.getItem(id) === 'true') {
            box.checked = true;
            span.classList.add('done');
          }
          box.addEventListener('change', () => {
            setChecked(id, box.checked);
            span.classList.toggle('done', box.checked);
            updateProgress();
          });
          span.addEventListener('click', () => {
            box.checked = !box.checked;
            box.dispatchEvent(new Event('change'));
          });

          row.appendChild(box);
          row.appendChild(span);

          if (item.eng) {
            const engBadge = document.createElement('span');
            engBadge.className = 'eng-badge';
            engBadge.textContent = 'ENG';
            row.appendChild(engBadge);
          }

          const link = document.createElement('a');
          link.className = 'link';
          link.href = item.link;
          link.target = '_blank';
          link.textContent = '🔗';
          row.appendChild(link);

          listEl.appendChild(row);
        });
      });
    });

    function updateProgress() {
      const all = document.querySelectorAll('input[type="checkbox"]');
      let total = 0, checked = 0;
      all.forEach(cb => {
        total++;
        if (cb.checked) checked++;
      });
      setProgress('bts-memories-2019', {checked, total});
      pushWeightedContributions('bts-memories-2019');
    }
    updateProgress();
    syncChecklistFromCloud(updateProgress);

    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }
  </script>
</body>
</html>
