<body>

  <script>
    const items = [
      { text: "1 серия", sub: "Am I wrong..?", links: [{ label: "Субтитры", link: "https://t.me/violent_arhive/4597" }, { label: "Озвучка", link: "https://t.me/violent_arhive/4585" }] },
      { text: "2 серия", sub: "Mama", links: [{ label: "Субтитры", link: "https://t.me/violent_arhive/4598" }, { label: "Озвучка", link: "https://t.me/violent_arhive/4586" }] },
      { text: "3 серия", sub: "Lie", links: [{ label: "Субтитры", link: "https://t.me/violent_arhive/4599" }, { label: "Озвучка", link: "https://t.me/violent_arhive/4587" }] },

      { text: "5 серия", sub: "Mikrocosmos", links: [{ label: "Субтитры", link: "https://t.me/violent_arhive/4638" }, { label: "Озвучка", link: "https://t.me/violent_arhive/4589" }] },
      { text: "6 серия", sub: "Cetomimidae", links: [{ label: "Субтитры", link: "https://t.me/violent_arhive/4663" }, { label: "Озвучка", link: "https://t.me/violent_arhive/4590" }] },
      { text: "7 серия", sub: "Man in the mirror", links: [{ label: "Озвучка", link: "https://t.me/violent_arhive/4591" }] },
      { text: "8 серия", sub: "13th Apostle", links: [{ label: "Озвучка", link: "https://t.me/violent_arhive/4592" }] },
      { text: "9 серия", sub: "Asteroid 2019 OK", links: [{ label: "Озвучка", link: "https://t.me/violent_arhive/4593" }] },
      { text: "10 серия", sub: "Hide and Seek", links: [{ label: "Озвучка", link: "https://t.me/violent_arhive/4594" }] },
      { text: "11 серия", sub: "The Note", links: [{ label: "Озвучка", link: "https://t.me/violent_arhive/4595" }] },
      { text: "12 серия", sub: "Begins ∞ Youth", links: [{ label: "Озвучка", link: "https://t.me/violent_arhive/4596" }] }
    ];

    const listEl = document.getElementById('list');
    items.forEach((item) => {
      const firstLink = item.links[0].link;
      const id = 'video-' + firstLink.split('/').pop();
      const row = document.createElement('div');
      row.className = 'row';
      row.dataset.id = id;

      const box = document.createElement('input');
      box.type = 'checkbox';

      const span = document.createElement('span');
      span.className = 'text';
      span.textContent = item.text;
      if (item.sub) {
        const sub = document.createElement('span');
        sub.className = 'sub';
        sub.textContent = item.sub;
        span.appendChild(sub);
      }

      if (localStorage.getItem(id) === 'true') {
        box.checked = true;
        span.classList.add('done');
      }
      box.addEventListener('change', () => {
        setChecked(id, box.checked);
        span.classList.toggle('done', box.checked);
        updateProgress();
      });
      span.addEventListener('click', () => {
        box.checked = !box.checked;
        box.dispatchEvent(new Event('change'));
      });

      const linksWrap = document.createElement('span');
      linksWrap.className = 'links-wrap';
      item.links.forEach((l) => {
        const a = document.createElement('a');
        a.href = l.link;
        a.target = '_blank';
        a.textContent = l.label;
        linksWrap.appendChild(a);
      });

      row.appendChild(box);
      row.appendChild(span);
      row.appendChild(linksWrap);
      listEl.appendChild(row);
    });

    function updateProgress() {
      const all = document.querySelectorAll('.row input[type="checkbox"]');
      let total = 0, checked = 0;
      all.forEach(cb => { total++; if (cb.checked) checked++; });
      setProgress('beginns-youth', {checked, total});
      pushWeightedContributions('beginns-youth');
    }
    updateProgress();
    syncChecklistFromCloud(updateProgress);
    refreshLocalStorageFromCloud(updateProgress);

    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }
  </script>
</body>
