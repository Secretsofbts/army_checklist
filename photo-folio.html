    input[type="checkbox"] { width: 18px; height: 18px; flex-shrink: 0; }
    .text { flex: 1; cursor: pointer; color: #333; }
    .text.done { color: #bbb; text-decoration: line-through; }
    .link { color: #999; text-decoration: none; font-size: 13px; flex-shrink: 0; }
    .extra {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 4px;
      font-size: 13px;
      color: #888;
      text-decoration: none;
    }
    .footer-link { display: block; text-align: center; font-size: 13px; color: #000; text-decoration: none; margin-top: 16px; padding-top: 12px; border-top: 1px solid #eee; }
  </style>

<body>

    <a class="back" href="bangtantv.html">← Назад</a>

      ]},
      { member: "❤️ Общий", scans: "https://telegra.ph/Obshchij-fotobuk-Us-Ourselves-and-BTS-11-11", items: [
        { text: "Concept Film", link: "https://t.me/violent_arhive/3596" },
        { text: "Выбор фотографий", link: "https://t.me/violent_arhive/3595" },
        { text: "Процесс съёмок", link: "https://t.me/violent_arhive/3294" }
      ]},
      { member: "💕 Джин", scans: "https://telegra.ph/Skany-fotobuka-Namdzhuna-Me-Myself-and-Jin-Sea-of-JIN-island-01-19", items: [

      ]},
      { member: "💚 Тэхён", scans: "https://telegra.ph/Skany-fotobuka-Tehhyona-Me-Myself-and-V-Veautiful-Days-01-19", items: [
        { text: "Concept Film", link: "https://t.me/violent_arhive/3594" },

      ]},
      { member: "🤍 Хосок", scans: "https://telegra.ph/Me-Myself-and-J-HOPE-All-New-Hope-02-01", items: [
        { text: "Concept Film", link: "https://t.me/violent_arhive/3653" },
        { text: "Production Film", link: "https://t.me/violent_arhive/3652" },
        { text: "Съёмки фотобука", link: "https://t.me/violent_arhive/3698" }
      ]},
      { member: "🖤 Юнги", scans: null, items: [
        { text: "Concept Film", link: "https://t.me/violent_arhive/3700" },
        { text: "Concept Film Full ver.", link: "https://t.me/violent_arhive/3773" },
        { text: "Аудио-скит", link: "https://t.me/violent_arhive/3702" },
        { text: "Making Film", link: "https://t.me/violent_arhive/3711" },
        { text: "Съёмки фотобука", link: "https://t.me/violent_arhive/3777" }
      ]},
      { member: "Что-то другое", scans: null, items: [
        { text: "Реакция на фотобуки (1 эпизод)", link: "https://t.me/violent_arhive/3295" },
        { text: "Реакция на фотобуки (2 эпизод)", link: "https://t.me/violent_arhive/3781" }
      ]}
    ];

    const listEl = document.getElementById('list');
    groups.forEach((group) => {
      const title = document.createElement('div');
      title.className = 'member-title';
      title.textContent = group.member;
      listEl.appendChild(title);

      group.items.forEach((item) => {
        const id = 'video-' + item.link.split('/').pop();
        const row = document.createElement('div');
        row.className = 'row';
        row.dataset.id = id;
        const box = document.createElement('input');
        box.type = 'checkbox';
        const span = document.createElement('span');
        span.className = 'text';
        span.textContent = item.text;
        if (localStorage.getItem(id) === 'true') { box.checked = true; span.classList.add('done'); }
        box.addEventListener('change', () => {
          setChecked(id, box.checked);
          span.classList.toggle('done', box.checked);
          updateProgress();
        });
        span.addEventListener('click', () => { box.checked = !box.checked; box.dispatchEvent(new Event('change')); });
        const link = document.createElement('a');
        link.className = 'link'; link.href = item.link; link.target = '_blank'; link.textContent = '🔗';
        row.appendChild(box); row.appendChild(span); row.appendChild(link);
        listEl.appendChild(row);
      });

      if (group.scans) {
        const a = document.createElement('a');
        a.className = 'extra';
        a.href = group.scans;
        a.target = '_blank';
        a.textContent = 'Сканы фотобука';
        listEl.appendChild(a);
      }
    });

    function updateProgress() {
      const all = document.querySelectorAll('.row input[type="checkbox"]');
      let total = 0, checked = 0;
      all.forEach(cb => { total++; if (cb.checked) checked++; });
      setProgress('photo-folio', {checked, total});
      pushWeightedContributions('photo-folio');
    }
    updateProgress();
    syncChecklistFromCloud(updateProgress);

    if (window.Telegram && window.Telegram.WebApp) { Telegram.WebApp.ready(); Telegram.WebApp.expand(); }
  </script>
</body>
</html>
