      text-decoration: none;
    }
    .navlink input[type="checkbox"] { width: 18px; height: 18px; flex-shrink: 0; margin-left: -6px; }
    .navlink-label { flex: 1; }
    .navlink-label .sub { font-weight: 400; }
    .navlink-label.done { color: #bbb; text-decoration: line-through; }
    .footer-link {
      display: block;
      text-align: center;
      font-size: 13px;
      color: #000;
      text-decoration: none;
      margin-top: 16px;
      padding-top: 12px;

<body>

      { navlink: true, text: "Made Collection By BTS", sub: "видео о том, как создавался эксклюзивный мерч от BTS", link: "other-shows-made-collection.html", statKey: "other-shows-made-collection" },
      { navlink: true, text: "Лаборатория MBTI", sub: "определение типа личности", link: "other-shows-mbti-lab.html", statKey: "other-shows-mbti-lab" },
      { navlink: true, text: "BTS Island: In the SEOM", sub: "разработка новой игры", link: "other-shows-in-the-seom.html", statKey: "other-shows-in-the-seom" },
      { navlink: true, text: "BTS X Cookie Run: Kingdom", sub: "коллаб с мобильной игрой", link: "other-shows-cookie-run.html", statKey: "other-shows-cookie-run" },
      { navlink: true, text: "Running Man", link: "other-shows-running-man.html", statKey: "other-shows-running-man" },

      { text: "Crush x J-Hope", hearts: "🤍", sub: "1 эпизод", link: "https://t.me/violent_arhive/3136" },
      { text: "Шоу IU \"The Palette\"", hearts: "🤍", link: "https://t.me/violent_arhive/2900" },
      { text: "\"Do You Know Me?\"", link: "https://t.me/violent_arhive/2796" },
      { text: "Алкогольный дневник", hearts: "💕", link: "https://t.me/violent_arhive/3216" },
      { navlink: true, text: "Шоу с Джимми Фэллоном", link: "other-shows-jimmy-fallon.html", statKey: "other-shows-jimmy-fallon" },
      { navlink: true, text: "Шоу с Джеймсом Корденом", link: "other-shows-james-corden.html", statKey: "other-shows-james-corden" },

      { navlink: true, text: "Game of Money", link: "other-shows-game-of-money.html", statKey: "other-shows-game-of-money" },
      { text: "Викторина с Бантанами", link: "https://t.me/violent_arhive/3277" },
      { text: "Джин в гостях у Мёнсу", hearts: "💕", link: "https://t.me/violent_arhive/3291" },
      { navlink: true, text: "Посиделки под градусом", hearts: "💕", link: "other-shows-drinking-party.html", statKey: "other-shows-drinking-party" },
      { text: "Спец. коллекция \"The Astronaut\"", hearts: "💕🤍", link: "https://t.me/violent_arhive/3334" },
      { navlink: true, text: "Словарь бесполезных человеческих знаний", hearts: "💙", link: "other-shows-useless-knowledge-dictionary.html", statKey: "other-shows-useless-knowledge-dictionary" },
      { text: "Psick Show с RM из BTS", hearts: "💙", link: "https://t.me/violent_arhive/3559" }
    ];

    const listEl = document.getElementById('list');

       function applyNavBadge(key) {
      var checkbox = document.getElementById('checkbox-' + key);
      var label = document.getElementById('label-' + key);
      var badge = document.getElementById('badge-' + key);
      var raw = localStorage.getItem('progress:' + key);
      if (!raw) return;
      var data = JSON.parse(raw);
      if (data.total === 0) return;
      if (data.checked === data.total) {
        if (checkbox) {
          checkbox.checked = true;
          checkbox.style.display = '';
        }
        if (label) label.classList.add('done');
      } else if (badge) {
        badge.textContent = data.checked + '/' + data.total;
      }
    }

        items.forEach((item) => {
      if (item.navlink) {
        const a = document.createElement('a');
        a.className = 'navlink';
        a.href = item.link;

        const box = document.createElement('input');
        box.type = 'checkbox';
        box.style.pointerEvents = 'none';
        box.id = 'checkbox-' + item.statKey;
        box.style.display = 'none';
        a.appendChild(box);

        const label = document.createElement('span');
        label.className = 'navlink-label';
        label.id = 'label-' + item.statKey;
        label.textContent = item.text;
        if (item.sub) {
          const sub = document.createElement('span');
          sub.className = 'sub';
          sub.textContent = item.sub;
          label.appendChild(sub);
        }
        a.appendChild(label);

        if (item.hearts) {
          const hearts = document.createElement('span');
          hearts.style.cssText = 'font-size:13px; flex-shrink:0;';
          hearts.textContent = item.hearts;
          a.appendChild(hearts);
        }

        const badge = document.createElement('span');
        badge.id = 'badge-' + item.statKey;
        badge.style.cssText = 'font-size:12px; color:#999; flex-shrink:0;';
        a.appendChild(badge);

        listEl.appendChild(a);
        applyNavBadge(item.statKey);
        return;
      }

      const id = 'video-' + item.link.split('/').pop();
      const row = document.createElement('div');
      row.className = 'row';
      row.dataset.id = id;

      const box = document.createElement('input');
      box.type = 'checkbox';

      const span = document.createElement('span');
      span.className = 'text';
      span.textContent = item.text;
      if (item.sub) {
        const sub = document.createElement('span');
        sub.className = 'sub';
        sub.textContent = item.sub;
        span.appendChild(sub);
      }

      if (localStorage.getItem(id) === 'true') {
        box.checked = true;
        span.classList.add('done');
      }
      box.addEventListener('change', () => {
        setChecked(id, box.checked);
        span.classList.toggle('done', box.checked);
        updateProgress();
      });
      span.addEventListener('click', () => {
        box.checked = !box.checked;
        box.dispatchEvent(new Event('change'));
      });

           const hearts = document.createElement('span');
      hearts.style.cssText = 'font-size:13px; flex-shrink:0;';
      hearts.textContent = item.hearts || '';

      const link = document.createElement('a');
      link.className = 'link';
      link.href = item.link;
      link.target = '_blank';
      link.textContent = '🔗';

      row.appendChild(box);
      row.appendChild(span);
      row.appendChild(hearts);
      row.appendChild(link);
      listEl.appendChild(row);
    });

        const weightedSources = [
      { ids: ["video-218", "video-220", "video-243", "video-3007", "video-3011", "video-3017"] }, // MapleStory X BTS — 6
      { allOf: ["video-3909","video-3910","video-3911","video-3912","video-3913","video-3914","video-3915","video-3917","video-3919","video-3920","video-3921","video-3922","video-3923"], weight: 1 }, // I-LAND 7 серия — 1 при полном комплекте
      { allOf: ["video-3924","video-3925","video-3926","video-3927"], weight: 1 }, // I-LAND 12 серия — 1 при полном комплекте
      { ids: ["video-290", "video-314", "video-760", "video-1164", "video-1166"] }, // Tokopedia — 5
      { ids: ["video-1980","video-1998","video-1997","video-1996","video-2028","video-2023","video-2031","video-2003","video-2002","video-2004","video-2001","video-2027","video-2024","video-2032"] }, // Made Collection — 14
      { ids: ["video-2655", "video-2688"] }, // MBTI Lab — 2
      { ids: ["video-2595", "video-2624", "video-2710", "video-2711"] }, // In the SEOM — 4
      { ids: ["video-3185", "video-3187"] }, // Cookie Run: Kingdom — 2 (без бонусных кадров)
      { ids: ["video-3292"] }, // Running Man — только 627 эпизод
      { ids: ["video-2654", "video-2689", "video-2709"] }, // WORKOUT — 3
      { ids: ["video-2876"] }, // Kiss The Radio — только Jimin 2022
      { ids: ["video-3163", "video-1094"] }, // Джимми Фэллон — 2
      { ids: ["video-947", "video-946", "video-2239"] }, // Джеймс Корден — 3 (без Прятки)
      { ids: ["video-991", "video-1032"] }, // Ли Хён менеджер — 2
      { ids: ["video-3129", "video-3140"] }, // Game of Money — 2
      { ids: ["video-3298", "video-3299", "video-3304", "video-3305"] }, // Посиделки под градусом — 4
      { ids: ["video-3549", "video-3583", "video-3709", "video-3710", "video-3742"] } // Словарь бесполезных знаний — первых 5
    ];

    function computeWeightedStats() {
      let checked = 0, total = 0;
      weightedSources.forEach((src) => {
        if (src.ids) {
          src.ids.forEach((id) => {
            total++;
            if (localStorage.getItem(id) === 'true') checked++;
          });
        } else if (src.allOf && src.weight) {
          total += src.weight;
          const allChecked = src.allOf.every((id) => localStorage.getItem(id) === 'true');
          if (allChecked) checked += src.weight;
        }
      });
      return { checked, total };
    }

    function updateProgress() {
      const all = document.querySelectorAll('.row input[type="checkbox"]');
      let total = 0, checked = 0;
      all.forEach(cb => {
        total++;
        if (cb.checked) checked++;
      });
      const weighted = computeWeightedStats();
      total += weighted.total;
      checked += weighted.checked;
      setProgress('other-shows-2020-2022', {checked, total});
    }
    updateProgress();
    syncChecklistFromCloud(updateProgress);

    if (typeof ARMY_USER_ID !== 'undefined' && ARMY_USER_ID) {
      fetch(`${FIREBASE_URL}/users/${ARMY_USER_ID}.json`)
        .then(res => res.json())
        .then(data => {
          if (!data) return;
          let changed = false;
          weightedSources.forEach((src) => {
            const ids = src.ids || src.allOf || [];
            ids.forEach((id) => {
              if (data[id] !== undefined && data[id] !== (localStorage.getItem(id) === 'true')) {
                localStorage.setItem(id, data[id]);
                changed = true;
              }
            });
          });
          if (changed) updateProgress();
        })
        .catch(() => {});
    }

    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }
  </script>
</body>
</html>
