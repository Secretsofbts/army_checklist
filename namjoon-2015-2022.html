      ]},
      { year: "2021", items: [

        { text: "Indigo Short Behind", sub: "от 05.12", link: "https://t.me/violent_arhive/3367" }
      ]}
    ];
    const listEl = document.getElementById('list');
    data.forEach((block) => {
      const yearTitle = document.createElement('div');
      yearTitle.className = 'year';
      yearTitle.textContent = block.year + ' год';
      listEl.appendChild(yearTitle);

      block.items.forEach((item) => {
        const id = 'video-' + item.link.split('/').pop();
        const row = document.createElement('div');
        row.className = 'row';
      row.dataset.id = id;

        const box = document.createElement('input');
        box.type = 'checkbox';

               const span = document.createElement('span');
        span.className = 'text';
        span.textContent = item.text;
        if (item.sub) {
          const sub = document.createElement('span');
          sub.style.cssText = 'display:block; font-size:11px; color:#999; margin-top:2px; font-weight:400;';
          sub.textContent = item.sub;
          span.appendChild(sub);
        }

        if (localStorage.getItem(id) === 'true') {
          box.checked = true;
          span.classList.add('done');
        }
        box.addEventListener('change', () => {
          setChecked(id, box.checked);
          span.classList.toggle('done', box.checked);
          updateProgress();
        });
        span.addEventListener('click', () => {
          box.checked = !box.checked;
          box.dispatchEvent(new Event('change'));
        });

        const link = document.createElement('a');
        link.className = 'link';
        link.href = item.link;
        link.target = '_blank';
        link.textContent = '🔗';

        row.appendChild(box);
        row.appendChild(span);
        row.appendChild(link);
        listEl.appendChild(row);
      });
    });

    function updateProgress() {
      const all = document.querySelectorAll('input[type="checkbox"]');
      let total = 0, checked = 0;
      all.forEach(cb => {
        total++;
        if (cb.checked) checked++;
      });
      setProgress('namjoon-2015-2022', {checked, total});
      pushWeightedContributions('namjoon-2015-2022');
    }
    updateProgress();
    syncChecklistFromCloud(updateProgress);

    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }
  </script>
</body>
