    const listEl = document.getElementById('list');
    data.forEach((block) => {
      const yearTitle = document.createElement('div');
      yearTitle.className = 'year';
      yearTitle.textContent = block.year + ' год';
      listEl.appendChild(yearTitle);

           block.items.forEach((item, ii) => {
        const id = item.link ? ('video-' + item.link.split('/').pop()) : ('noline-hoseok-' + block.year + '-' + ii);
        const oldId = 'noline-hoseok-' + block.year + '-' + ii;
        const row = document.createElement('div');
        row.className = 'row';
        row.dataset.id = id;

        const box = document.createElement('input');
        box.type = 'checkbox';

                const span = document.createElement('span');
        span.className = 'text';
        span.textContent = item.text;
        if (item.sub) {
          const sub = document.createElement('span');
          sub.style.cssText = 'display:block; font-size:11px; color:#999; margin-top:2px; font-weight:400;';
          sub.textContent = item.sub;
          span.appendChild(sub);
        }

        let saved = localStorage.getItem(id);
        if (saved === null && item.link && oldId !== id) {
          saved = localStorage.getItem(oldId);
          if (saved === 'true') {
            setChecked(id, true);
          }
        }
        if (saved === 'true') {
          box.checked = true;
          span.classList.add('done');
        }
        box.addEventListener('change', () => {
          setChecked(id, box.checked);
          span.classList.toggle('done', box.checked);
          updateProgress();
        });
        span.addEventListener('click', () => {
          box.checked = !box.checked;
          box.dispatchEvent(new Event('change'));
        });

               row.appendChild(box);
        row.appendChild(span);

        if (item.link) {
          if (!item.link.includes('t.me/violent_arhive')) {
            const sourceBadge = document.createElement('span');
            sourceBadge.style.cssText = 'font-size:9px; color:#9b7fd4; border:1px solid #d9cdf0; border-radius:5px; padding:1px 4px; flex-shrink:0;';
            sourceBadge.textContent = 'VK';
            row.appendChild(sourceBadge);
          }
          const link = document.createElement('a');
          link.className = 'link';
          link.href = item.link;
          link.target = '_blank';
          link.textContent = '🔗';
          row.appendChild(link);
        }

        listEl.appendChild(row);
      });
    });

    function updateProgress() {
      const all = document.querySelectorAll('input[type="checkbox"]');
      let total = 0, checked = 0;
      all.forEach(cb => {
        total++;
        if (cb.checked) checked++;
      });
      setProgress('hoseok-2023-2025', {checked, total});
      pushWeightedContributions('hoseok-2023-2025');
    }
    updateProgress();
    syncChecklistFromCloud(updateProgress);

    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
