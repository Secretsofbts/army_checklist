    }
    .row {

      align-items: center;
      gap: 10px;
      padding: 8px 4px;
      border-bottom: 1px solid #f0f0f0;
      font-size: 14px;
    }
    input[type="checkbox"] { width: 18px; height: 18px; flex-shrink: 0; }
    .done { color: #bbb; text-decoration: line-through; }
    .text { flex: 1; cursor: pointer; }
    .link { color: #aaa; text-decoration: none; font-size: 13px; flex-shrink: 0; }
  </style>
</head>

    const listEl = document.getElementById('list');
    data.forEach((block) => {
      const yearTitle = document.createElement('div');
      yearTitle.className = 'year';
      yearTitle.textContent = block.year + ' год';
      listEl.appendChild(yearTitle);

      block.items.forEach((item, ii) => {
        const id = item.link ? ('video-' + item.link.split('/').pop()) : ('noline-hoseok-' + block.year + '-' + ii);
        const row = document.createElement('div');
        row.className = 'row';

        const box = document.createElement('input');
        box.type = 'checkbox';

        const span = document.createElement('span');
        span.className = 'text';
        span.textContent = item.text;

        if (localStorage.getItem(id) === 'true') {
          box.checked = true;
          span.classList.add('done');
        }
        box.addEventListener('change', () => {
          localStorage.setItem(id, box.checked);
          span.classList.toggle('done', box.checked);
          updateProgress();
        });
        span.addEventListener('click', () => {
          box.checked = !box.checked;
          box.dispatchEvent(new Event('change'));
        });

        row.appendChild(box);
        row.appendChild(span);

        if (item.link) {
          const link = document.createElement('a');
          link.className = 'link';
          link.href = item.link;
          link.target = '_blank';
          link.textContent = '🔗';
          row.appendChild(link);
        }

        listEl.appendChild(row);
      });
    });

    function updateProgress() {
      const all = document.querySelectorAll('input[type="checkbox"]');
      let total = 0, checked = 0;
      all.forEach(cb => {
        total++;
        if (cb.checked) checked++;
      });
      localStorage.setItem('progress:hoseok-2023-2025', JSON.stringify({checked, total}));
    }
    updateProgress();

    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }
  </script>
</body>
</html>
