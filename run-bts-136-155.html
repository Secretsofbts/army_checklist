      { text: "154 эпизод", desc: "\"Run bts\" 1 часть", link: "https://t.me/violent_arhive/1439", sub: { text: "Закадровые", link: "https://t.me/violent_arhive/1513" } },
      { text: "155 эпизод", desc: "\"Run bts\" 2 часть", link: "https://t.me/violent_arhive/1473", sub: { text: "Закадровые", link: "https://t.me/violent_arhive/1593" } }
    ];

    function makeRow(container, item, isSub, hasSub) {
      const id = 'video-' + item.link.split('/').pop();
      const row = document.createElement('div');
      row.className = isSub ? 'subrow' : 'row';
      if (hasSub) row.style.borderBottom = 'none';

      const box = document.createElement('input');
      box.type = 'checkbox';

      const span = document.createElement('span');
      span.className = 'text';
      span.textContent = item.text;
      if (item.desc) {
        const desc = document.createElement('span');
        desc.style.cssText = 'display:block; font-size:11px; color:#999; margin-top:2px; font-weight:400;';
        desc.textContent = item.desc;
        span.appendChild(desc);
      }

      if (localStorage.getItem(id) === 'true') {
        box.checked = true;
        span.classList.add('done');
      }
      box.addEventListener('change', () => {
        localStorage.setItem(id, box.checked);
        span.classList.toggle('done', box.checked);
        updateProgress();
      });
      span.addEventListener('click', () => {
        box.checked = !box.checked;
        box.dispatchEvent(new Event('change'));
      });

      const link = document.createElement('a');
      link.className = 'link';
      link.href = item.link;
      link.target = '_blank';
      link.textContent = '🔗';

      row.appendChild(box);
      row.appendChild(span);
      row.appendChild(link);
      container.appendChild(row);
    }

    const listEl = document.getElementById('list');
    items.forEach((item) => {
      if (item.noteOnly) {
        const noteEl = document.createElement('p');
        noteEl.style.cssText = 'font-size:12px; color:#999; font-style:italic; margin:8px 4px;';
        noteEl.textContent = item.note;
        listEl.appendChild(noteEl);
        return;
      }
      makeRow(listEl, item, false, !!item.sub);
      if (item.sub) {
        makeRow(listEl, item.sub, true);
      }
    });

    function updateProgress() {
      const all = document.querySelectorAll('.row input[type="checkbox"]');
      let total = 0, checked = 0;
      all.forEach(cb => {
        total++;
        if (cb.checked) checked++;
      });
      localStorage.setItem('progress:run-bts-136-155', JSON.stringify({checked, total}));
    }
    updateProgress();

    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }
  </script>
