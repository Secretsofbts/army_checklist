      { text: "135 серия \"2021 Мастерская Run Bts\" 3 часть", link: "https://t.me/violent_arhive/636", sub: { text: "Закадровые", link: "https://t.me/violent_arhive/649" } }
    ];

    function makeRow(container, item, isSub) {
      const id = 'video-' + item.link.split('/').pop();
      const row = document.createElement('div');
      row.className = isSub ? 'subrow' : 'row';

      const box = document.createElement('input');
      box.type = 'checkbox';

      const span = document.createElement('span');
      span.className = 'text';
      span.textContent = item.text;

      if (localStorage.getItem(id) === 'true') {
        box.checked = true;
        span.classList.add('done');
      }
      box.addEventListener('change', () => {
        localStorage.setItem(id, box.checked);
        span.classList.toggle('done', box.checked);
        updateProgress();
      });
      span.addEventListener('click', () => {
        box.checked = !box.checked;
        box.dispatchEvent(new Event('change'));
      });

      const link = document.createElement('a');
      link.className = 'link';
      link.href = item.link;
      link.target = '_blank';
      link.textContent = '🔗';

      row.appendChild(box);
      row.appendChild(span);
      row.appendChild(link);
      container.appendChild(row);
    }

    const listEl = document.getElementById('list');
    items.forEach((item) => {
      makeRow(listEl, item, false);
      if (item.sub) {
        makeRow(listEl, item.sub, true);
      }
    });

    function updateProgress() {
      const all = document.querySelectorAll('.row input[type="checkbox"]');
      let total = 0, checked = 0;
      all.forEach(cb => {
        total++;
        if (cb.checked) checked++;
      });
      localStorage.setItem('progress:run-bts-112-135', JSON.stringify({checked, total}));
    }
    updateProgress();

    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }
  </script>
</body>
</html>
