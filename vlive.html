<script>
  function renderBadgeTotal(elId, keys) {
    var el = document.getElementById(elId);
    var checked = 0, total = 0;
    keys.forEach(function(key) {
      var raw = localStorage.getItem('progress:' + key);
      if (raw) {
        var data = JSON.parse(raw);
        checked += data.checked;
        total += data.total;
      }
    });
    if (total === 0) {
      el.textContent = '';
      return;
    }
        if (checked === total) {
      el.textContent = '✅';
      el.style.color = '#2e9e5b';
      el.closest('.card').classList.add('row-done');
    } else {
      el.textContent = checked + '/' + total;
    }
  }
  renderBadgeTotal('badge-jungkook', ['jungkook-2016-2022', 'jungkook-2023-2024', 'jungkook-2025-2026']);
  renderBadgeTotal('badge-taehyung', ['taehyung-2015-2022', 'taehyung-2023-2024', 'taehyung-2025', 'taehyung-2026']);
  renderBadgeTotal('badge-comeback', ['comeback']);

  if (window.Telegram && window.Telegram.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  }
</script>
