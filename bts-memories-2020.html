    const listEl = document.getElementById('list');
    data.forEach((disc) => {
      const discTitle = document.createElement('div');
      discTitle.className = 'disc-title';
      discTitle.textContent = disc.disc + ':';
      listEl.appendChild(discTitle);

      disc.groups.forEach((group) => {
        if (group.sub) {
          const subTitle = document.createElement('div');
          subTitle.className = 'sub-title';
          subTitle.textContent = group.sub + ':';
          listEl.appendChild(subTitle);
        }

        group.items.forEach((item) => {
          const id = 'video-' + item.link.split('/').pop();
          const row = document.createElement('div');
          row.className = 'row';
          row.dataset.id = id;

          const box = document.createElement('input');
          box.type = 'checkbox';

          const span = document.createElement('span');
          span.className = 'text';
          span.textContent = item.text;
          if (item.sub) {
            const sub = document.createElement('span');
            sub.className = 'sub';
            sub.textContent = item.sub;
            span.appendChild(sub);
          }

          if (localStorage.getItem(id) === 'true') {
            box.checked = true;
            span.classList.add('done');
          }
          box.addEventListener('change', () => {
            setChecked(id, box.checked);
            span.classList.toggle('done', box.checked);
            updateProgress();
          });
          span.addEventListener('click', () => {
            box.checked = !box.checked;
            box.dispatchEvent(new Event('change'));
          });

          const link = document.createElement('a');
          link.className = 'link';
          link.href = item.link;
          link.target = '_blank';
          link.textContent = '🔗';

          row.appendChild(box);
          row.appendChild(span);
          row.appendChild(link);
          listEl.appendChild(row);
        });
      });
    });

    function updateProgress() {
      const all = document.querySelectorAll('input[type="checkbox"]');
      let total = 0, checked = 0;
      all.forEach(cb => {
        total++;
        if (cb.checked) checked++;
      });
      setProgress('bts-memories-2020', {checked, total});
      pushWeightedContributions('bts-memories-2020');
    }
    updateProgress();
    syncChecklistFromCloud(updateProgress);

    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
