<body>
  <div class="app">
    <a class="back" href="shows.html">в†ђ РќР°Р·Р°Рґ</a>

       <p class="intro">2014 РіРѕРґ</p>
    <p class="intro">РЁРѕСѓ Рѕ С‚РѕРј, РєР°Рє BTS Р±Р»РёР¶Рµ Р·РЅР°РєРѕРјРёР»РёСЃСЊ СЃ С…РёРї-С…РѕРї РєСѓР»СЊС‚СѓСЂРѕР№ РђРјРµСЂРёРєРё</p>
    <div id="list"></div>
    <a class="footer-link" href="shows.html">РџРѕСЃС‚ РІСЃРµС… С€РѕСѓ в¬…пёЏ</a>
  </div>

  <script>
      const navItems = [
        { text: "РЎРµСЂРёРё С€РѕСѓ", link: "american-hustle-life-episodes.html", statKey: "american-hustle-life-episodes" },
                { text: "Р’С‹СЂРµР·Р°РЅРЅС‹Рµ СЃС†РµРЅС‹", sub: "РЅРµ РёРґСѓС‚ РІ СЃС‚Р°С‚РёСЃС‚РёРєСѓ", link: "american-hustle-life-deleted.html", statKey: "american-hustle-life-deleted" }
      ];

    const listEl = document.getElementById('list');
    navItems.forEach((item) => {
      const a = document.createElement('a');
      a.className = 'navlink';
      a.href = item.link;
           const label = document.createElement('span');
      label.className = 'navlink-label';
      label.style.flex = '1';
      label.textContent = item.text;
      if (item.sub) {
        const sub = document.createElement('span');
        sub.style.cssText = 'display:block; font-size:11px; color:#999; margin-top:2px; font-weight:400;';
        sub.textContent = item.sub;
        label.appendChild(sub);
      }
      if (item.statKey) {
        const box = document.createElement('input');
        box.type = 'checkbox';
        box.style.pointerEvents = 'none';
        box.id = 'checkbox-' + item.statKey;
        box.style.display = 'none';
        a.appendChild(box);
      }
      a.appendChild(label);
      const badge = document.createElement('span');
      badge.id = 'badge-' + item.statKey;
      badge.style.cssText = 'font-size:12px; color:#999; flex-shrink:0;';
      a.appendChild(badge);
      listEl.appendChild(a);
    });

       function applyBadge(key, data) {
      var el = document.getElementById('badge-' + key);
      if (!el || !data || data.total === 0) { if (el) el.textContent = ''; return; }
      if (data.checked === data.total) {
        el.textContent = 'вњ…';
        el.style.color = '#2e9e5b';
        var card = el.closest('.navlink');
        if (card) card.style.background = '#e3f7e9';
      } else {
        el.textContent = data.checked + '/' + data.total;
      }
    }

        const navKeys = navItems.map(i => i.statKey);
    function renderAllBadges() {
      navKeys.forEach((key) => {
        var known = getStatTotal(key);
        var raw = localStorage.getItem('progress:' + key);
        var data = raw ? JSON.parse(raw) : null;
        if (known !== null) {
          applyBadge(key, { checked: data ? data.checked : 0, total: known });
        } else {
          applyBadge(key, data);
        }
      });
    }
    renderAllBadges();
    refreshLocalStorageFromCloud(renderAllBadges);

    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }
  </script>
