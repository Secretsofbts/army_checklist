  <script>
        function applyBadge(elId, key) {
       const el = document.getElementById(elId);
      if (!el) return;
      const known = getStatTotal(key);
      const raw = localStorage.getItem('progress:' + key);
      const d = raw ? JSON.parse(raw) : null;
      const checked = d ? d.checked : 0;
      const total = known !== null ? known : (d ? d.total : 0);
      if (total === 0) return;
      if (checked === total) {
        el.textContent = '✅';
        el.style.color = '#2e9e5b';
        const card = el.closest('.card');
        if (card) card.style.background = '#e3f7e9';
      } else {
        el.textContent = checked + '/' + total;
      }
    }
                  applyBadge('badge-sleepy', 'sleepy-interview');
    applyBadge('badge-fm', 'fm-0613');
    applyBadge('badge-korean', 'learn-korean');
    applyBadge('badge-td', 'td-stories');
       applyBadge('badge-halloween', 'halloween');
       applyBadge('badge-hwarang', 'hwarang');
         applyBadge('badge-beginns', 'beginns-youth');

    const mcountdownKeys = ['mcountdown-2013', 'mcountdown-2014', 'mcountdown-2015', 'mcountdown-2016', 'mcountdown-2017', 'mcountdown-2018', 'mcountdown-2019', 'mcountdown-2020', 'mcountdown-2022', 'mcountdown-2023', 'mcountdown-2025'];
           function applyBadgeTotalMisc(elId, keys) {
      const el = document.getElementById(elId);
      if (!el) return;
      let checked = 0, total = 0;
      let allKnown = true;
      keys.forEach((key) => {
        const known = getStatTotal(key);
        const raw = localStorage.getItem('progress:' + key);
        const d = raw ? JSON.parse(raw) : null;
        if (known !== null) {
          total += known;
          checked += d ? d.checked : 0;
        } else if (d) {
          total += d.total;
          checked += d.checked;
        } else {
          allKnown = false;
        }
      });
      if (total === 0) { el.textContent = ''; return; }
      if (allKnown && checked === total) {
        el.textContent = '✅';
        el.style.color = '#2e9e5b';
        const card = el.closest('.card');
        if (card) card.style.background = '#e3f7e9';
      } else {
        el.textContent = checked + '/' + total;
      }
    }
    applyBadgeTotalMisc('badge-mcountdown', mcountdownKeys);
    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }
  </script>
