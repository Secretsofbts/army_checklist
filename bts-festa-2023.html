      { text: "j-hope - Arson", sub: "Rock ver.", icon: "🎶", link: "https://youtu.be/9CqMjpB-tAY" },

      { text: "Письмо от Чонгука", icon: "💌", link: "https://t.me/secretsofbts/44587", noCheckbox: true },
      { text: "Вечерний Ким Намджун", sub: "эфир с фестиваля под открытым небом в Ёыйдо", icon: "🎥", link: "https://t.me/violent_arhive/4094" },
      { text: "RM's Radio", icon: "💣", link: "https://t.me/violent_arhive/4634" },

      { text: "Салют в парке Ёыйдо", icon: "🎆", link: "https://youtu.be/ThOKaOMgbBo" }
    ];

    function renderItem(container, item) {
      if (item.noCheckbox) {
        const a = document.createElement('a');
        a.className = 'row';
        a.href = item.link;
        a.target = '_blank';
        a.style.textDecoration = 'none';
        const spacer = document.createElement('input');
        spacer.type = 'checkbox';
        spacer.disabled = true;
        spacer.style.cssText = 'width:18px; height:18px; flex-shrink:0; visibility:hidden;';
        const span = document.createElement('span');
        span.className = 'text';
        span.style.cursor = 'default';
        span.textContent = item.text;
        if (item.sub) {
          const sub = document.createElement('span');
          sub.style.cssText = 'display:block; font-size:11px; color:#999; margin-top:2px; font-weight:400;';
          sub.textContent = item.sub;
          span.appendChild(sub);
        }
        const icon = document.createElement('span');
        icon.className = 'icon';
        icon.textContent = item.icon || '';
        const link = document.createElement('span');
        link.className = 'link';
        link.textContent = '🔗';
        a.appendChild(spacer);
        a.appendChild(span);
        if (icon.textContent) a.appendChild(icon);
        a.appendChild(link);
        container.appendChild(a);
        return;
      }

      const firstLink = item.links ? item.links[0].link : item.link;
      const id = 'video-' + firstLink.split('/').pop();
      const row = document.createElement('div');
      row.className = 'row';
      row.dataset.id = id;

      const box = document.createElement('input');
      box.type = 'checkbox';

      const span = document.createElement('span');
      span.className = 'text';
      span.textContent = item.text;
      if (item.sub) {
        const sub = document.createElement('span');
        sub.style.cssText = 'display:block; font-size:11px; color:#999; margin-top:2px; font-weight:400;';
        sub.textContent = item.sub;
        span.appendChild(sub);
      }

      if (localStorage.getItem(id) === 'true') {
        box.checked = true;
        span.classList.add('done');
      }
      box.addEventListener('change', () => {
        setChecked(id, box.checked);
        span.classList.toggle('done', box.checked);
        updateProgress();
      });
      span.addEventListener('click', () => {
        box.checked = !box.checked;
        box.dispatchEvent(new Event('change'));
      });

      row.appendChild(box);
      row.appendChild(span);

      if (item.icon) {
        const icon = document.createElement('span');
        icon.className = 'icon';
        icon.textContent = item.icon;
        row.appendChild(icon);
      }

      if (item.links) {
        const linksWrap = document.createElement('span');
        linksWrap.style.cssText = 'display:flex; flex-direction:column; gap:4px; flex-shrink:0; align-items:flex-end;';
        item.links.forEach((l) => {
          const a = document.createElement('a');
          a.href = l.link;
          a.target = '_blank';
          a.style.cssText = 'font-size:10px; color:#999; text-decoration:none; border:1px solid #eee; border-radius:6px; padding:2px 5px;';
          a.textContent = l.label;
          linksWrap.appendChild(a);
        });
        row.appendChild(linksWrap);
      } else {
        const link = document.createElement('a');
        link.className = 'link';
        link.href = item.link;
        link.target = '_blank';
        link.textContent = '🔗';
        row.appendChild(link);
      }

      container.appendChild(row);
    }

    const listEl = document.getElementById('list');
    items.forEach((item) => renderItem(listEl, item));

    function updateProgress() {
      const all = document.querySelectorAll('.row input[type="checkbox"]:not([disabled])');
      let total = 0, checked = 0;
      all.forEach(cb => { total++; if (cb.checked) checked++; });
      setProgress('bts-festa-2023', {checked, total});
      pushWeightedContributions('bts-festa-2023');
    }
    updateProgress();
    syncChecklistFromCloud(updateProgress);
    refreshLocalStorageFromCloud(updateProgress);

    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }
  </script>
</body>
</html>
