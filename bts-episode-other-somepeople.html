<body>
  <div class="app">

  <script>
    const items = [

      { text: "BTS 'ARIRANG': закулисье альбомной фотосессии", link: "https://t.me/violent_arhive/5401" },
      { text: "SWIM MV бэкстейдж клипа", link: "https://t.me/violent_arhive/5403" },
      { text: "2.0 MV бэкстейдж клипа", link: "https://t.me/violent_arhive/5455" },
      { text: "Hooligan MV бэкстейдж клипа", link: "https://t.me/violent_arhive/5480" },
      { text: "BTS Скетч с танцевальной практики SWIM", link: "https://t.me/violent_arhive/5487" },
      { text: "THE COMEBACK LIVE l ARIRANG Sketch", link: "https://t.me/violent_arhive/5507" },
      { text: "BTS в гостях у президента Мексики", link: "https://t.me/violent_arhive/5522" },
      { text: "\"ARIRANG\" промо в Северной Америке", link: "https://t.me/violent_arhive/5500" },
      { text: "Тур BTS \"ARIRANG\" в Гояне", link: "https://t.me/violent_arhive/5502" },
      { text: "Скетч с репетиций хореографии BTS «Hooligan» и «2.0»", link: "https://t.me/violent_arhive/5541" },
      { text: "Бэкстейдж со съёмок клипа BTS «Merry Go Round»", link: "https://t.me/violent_arhive/5540" },
      { text: "TOUR 'ARIRANG' в Токио", link: "https://t.me/violent_arhive/5545" },
      { text: "American Music Awards 2026", link: "https://t.me/violent_arhive/5539" },
      { text: "Закулисье съемок \"NORMAL\"", link: "https://t.me/violent_arhive/5562" },
      { text: "Мировой тур BTS «ARIRANG» в Северной Америке - 1 часть", link: "https://t.me/violent_arhive/5572" },
      { text: "Скетч BTS «ARIRANG» в Пусане", link: "https://t.me/violent_arhive/5607" },
      { text: "На ЧМ по футболу FIFA 2026", link: "https://t.me/violent_arhive/5608" }
    ];

        const listEl = document.getElementById('list');
    items.forEach((item) => {
      const id = 'video-' + item.link.split('/').pop();
      const row = document.createElement('div');
      row.className = 'row';
      row.dataset.id = id;

      const box = document.createElement('input');
      box.type = 'checkbox';

      const span = document.createElement('span');
      span.className = 'text';
      span.textContent = item.text;

      if (localStorage.getItem(id) === 'true') {
        box.checked = true;
        span.classList.add('done');
      }
      box.addEventListener('change', () => {
        setChecked(id, box.checked);
        span.classList.toggle('done', box.checked);
        updateProgress();
      });
      span.addEventListener('click', () => {
        box.checked = !box.checked;
        box.dispatchEvent(new Event('change'));
      });

      const link = document.createElement('a');
      link.className = 'link';
      link.href = item.link;
      link.target = '_blank';
      link.textContent = '🔗';

      row.appendChild(box);
      row.appendChild(span);
      row.appendChild(link);
      listEl.appendChild(row);
    });

    function updateProgress() {
      const all = document.querySelectorAll('input[type="checkbox"]');
      let total = 0, checked = 0;
      all.forEach(cb => {
        total++;
        if (cb.checked) checked++;
      });
      setProgress('bts-episode-other-somepeople', {checked, total});
    }
    updateProgress();
    syncChecklistFromCloud(updateProgress);

    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }
  </script>
</body>
