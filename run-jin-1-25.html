       function renderList(containerId, arr) {
      const listEl = document.getElementById(containerId);
      arr.forEach((item) => {
        const id = 'video-' + item.link.split('/').pop();
        const row = document.createElement('div');
        row.className = 'row';
      row.dataset.id = id;
        row.dataset.id = id;

        const box = document.createElement('input');
        box.type = 'checkbox';

        const span = document.createElement('span');
        span.className = 'text';
        span.textContent = item.text;
        if (item.sub) {
          const sub = document.createElement('span');
          sub.style.cssText = 'display:block; font-size:11px; color:#999; margin-top:2px; font-weight:400;';
          sub.textContent = item.sub;
          span.appendChild(sub);
        }

        if (localStorage.getItem(id) === 'true') {
          box.checked = true;
          span.classList.add('done');
        }
        box.addEventListener('change', () => {
          setChecked(id, box.checked);
          span.classList.toggle('done', box.checked);
          updateProgress();
        });
        span.addEventListener('click', () => {
          box.checked = !box.checked;
          box.dispatchEvent(new Event('change'));
        });

        const link = document.createElement('a');
        link.className = 'link';
        link.href = item.link;
        link.target = '_blank';
        link.textContent = 'рџ”—';

        row.appendChild(box);
        row.appendChild(span);
        row.appendChild(link);
        listEl.appendChild(row);
      });
    }

    function updateProgress() {
      const all = document.querySelectorAll('input[type="checkbox"]');
      let total = 0, checked = 0;
      all.forEach(cb => {
        total++;
        if (cb.checked) checked++;
      });
      setProgress('run-jin-1-25', {checked, total});
      pushWeightedContributions('run-jin-1-25');
    }
